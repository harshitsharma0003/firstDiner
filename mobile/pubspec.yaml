name: firstdiner
description: firstDiner — book weeknight restaurant deals.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1   # Inter (UI) + Fraunces (display), matching the web console

  # Production phone auth (see lib/api_client.dart + lib/screens/login.dart).
  # Versions match the Newspresso / DJP Mart apps, where iOS phone OTP works.
  # firebase_messaging is required, not optional: Firebase verifies the app via a
  # silent APNs push before it will send the SMS. Without it, iOS falls back to
  # reCAPTCHA (or stalls) and no OTP is ever dispatched.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
